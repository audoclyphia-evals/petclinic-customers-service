openapi: 3.0.3
info:
  title: API Documentation
  description: Auto-generated API documentation
  version: 1.0.0
paths:
  /owners/*/pets/{petId}:
    get:
      summary: Retrieve a specific pet's details by ID
      description: Returns the details for a pet identified by its unique ID
      operationId: getPetDetails
      tags:
      - Pets
      responses:
        '200':
          description: Pet details retrieved successfully
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized access
        '500':
          description: Internal server error
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
        description: Unique identifier of the pet
  /petTypes:
    get:
      summary: HTTP endpoint to retrieve all pet types from the repository
      description: Retrieves a list of all available pet types from the repository.
      operationId: getPetTypes
      tags:
      - PetTypes
      responses:
        '200':
          description: Success
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /owners/{ownerId}/pets:
    post:
      summary: Create a new pet for a specific owner
      description: Creates a new pet and associates it with the specified owner.
      operationId: createPetForOwner
      tags:
      - Pet
      responses:
        '201':
          description: Pet created successfully
        '400':
          description: Bad request, invalid parameters
        '401':
          description: Unauthorized
        '404':
          description: Owner not found
        '500':
          description: Internal server error
      parameters:
      - name: ownerId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Unique identifier of the owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - birthDate
              - typeId
              properties:
                name:
                  type: string
                  description: Name of the pet
                birthDate:
                  type: string
                  format: date
                  description: Birth date in YYYY-MM-DD format
                typeId:
                  type: integer
                  description: ID of the pet type
            example:
              name: Fido
              birthDate: '2020-01-01'
              typeId: 1
  /owners:
    post:
      summary: REST endpoint to create a new Owner
      description: Creates a new Owner record in the system and returns the saved
        entity
      operationId: createOwner
      tags:
      - Owner
      responses:
        '201':
          description: Owner created successfully
        '400':
          description: Invalid input data
        '500':
          description: Internal server error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - firstName
              - lastName
              - address
              - city
              - telephone
              properties:
                firstName:
                  type: string
                  description: Owner's first name
                lastName:
                  type: string
                  description: Owner's last name
                address:
                  type: string
                  description: Owner's street address
                city:
                  type: string
                  description: Owner's city
                telephone:
                  type: string
                  description: Owner's telephone number
    get:
      summary: REST endpoint to retrieve all Owners
      description: Retrieves a list of all Owner entities from the database.
      operationId: getAllOwners
      tags:
      - Owner
      responses:
        '200':
          description: Successful retrieval of Owner list
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /owners/{ownerId}:
    get:
      summary: REST endpoint to retrieve a single Owner by ID
      description: Retrieves a specific Owner by their unique identifier.
      operationId: findOwner
      tags:
      - Owner
      responses:
        '200':
          description: Success
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      parameters:
      - name: ownerId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Unique identifier of the Owner
    put:
      summary: Update an existing owner
      description: Update owner details by ID with validation
      operationId: updateOwner
      tags:
      - Owner
      responses:
        '204':
          description: Owner updated successfully
        '400':
          description: Invalid request parameters
        '404':
          description: Owner not found
        '500':
          description: Internal server error
      parameters:
      - name: ownerId
        in: path
        required: true
        schema:
          type: integer
        description: Unique identifier of the owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - firstName
              - lastName
              - address
              - city
              - telephone
              properties:
                firstName:
                  type: string
                  description: Owner's first name
                lastName:
                  type: string
                  description: Owner's last name
                address:
                  type: string
                  description: Owner's address
                city:
                  type: string
                  description: Owner's city
                telephone:
                  type: string
                  description: Owner's telephone number
tags:
- name: Owner
- name: Pet
- name: PetTypes
- name: Pets